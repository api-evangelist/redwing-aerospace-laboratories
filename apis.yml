name: RedWing Aerospace Laboratories
description: >-
  RedWing Aerospace Laboratories (RedWing Labs, operated by Kitemaps AMS Pvt Ltd)
  is a Bangalore, India based, Techstars-backed company that designs, develops and
  deploys fully autonomous drones to transform logistics supply chains. It offers a
  fleet of long-range, urban and medium-range delivery aircraft plus an operations
  software suite, and runs an autonomous four-step delivery flow (order, handoff to
  flight operations, proof of delivery, return to hub) used to move healthcare
  products, food and other goods within the hour. The company reports operational
  milestones including 145,930+ kilometers flown and thousands of deliveries
  completed. RedWing does not publish a first-party developer API; its public agent
  surface is the platform-provided Wix Site MCP endpoint advertised in its llms.txt.
